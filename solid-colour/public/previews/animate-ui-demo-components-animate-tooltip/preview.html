<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animate-ui-demo-components-animate-tooltip</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body class="min-h-dvh grid place-items-center p-8 bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="./preview.js"></script>
    <script>
      (function () {
        window.addEventListener("message", function (e) {
          var d = e.data;
          if (!d || d.type !== "atlas:theme") return;
          document.documentElement.classList.toggle("dark", d.theme === "dark");
        });
        function ready() {
          if (window.parent === window) return;
          window.parent.postMessage({ type: "atlas:ready", height: document.body.scrollHeight }, "*");
        }
        window.addEventListener("load", function () { setTimeout(ready, 50); });
        new ResizeObserver(ready).observe(document.body);
      })();
    </script>
  </body>
</html>
